name: Cancel remaining jobs on failure
description: Cancel the current run so no sibling job keeps working after this job failed.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      # Fork pull requests run with a read-only token that no permissions: block can elevate, so the
      # cancel returns 403 there. Keep the fail-fast best-effort: a token that cannot cancel must not
      # turn an otherwise-green job red.
      run: gh run cancel "${{ github.run_id }}" || echo "::warning::could not cancel run ${{ github.run_id }}"
