name: Set up Rust tools
description: Install the repository toolchain and selected mise tools
inputs:
  tools:
    description: Tools passed to mise install
    required: true
  toolchain:
    description: Rust toolchain override
    required: false
    default: ""
  components:
    description: Additional Rust components
    required: false
    default: ""
  targets:
    description: Additional Rust targets
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        target: ${{ inputs.targets }}
        cache: false
    - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
      with:
        install_args: cargo-binstall ${{ inputs.tools }}
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      env:
        NODE_OPTIONS: --no-deprecation # https://github.com/Swatinem/rust-cache/issues/331
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
