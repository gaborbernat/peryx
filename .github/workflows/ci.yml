name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      contract_packages: ${{ steps.crates.outputs.packages }}
      contract_packages_all: ${{ steps.crates.outputs.available }}
      contracts: ${{ steps.crates.outputs.selected }}
      automation: ${{ steps.filter.outputs.automation }}
      shared: ${{ steps.filter.outputs.shared }}
      pypi: ${{ steps.filter.outputs.pypi }}
      oci: ${{ steps.filter.outputs.oci }}
      frontend_tests: ${{ steps.filter.outputs.frontend_tests }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          list-files: json
          filters: |
            contract_inputs:
              - '**'
            rust:
              - 'crates/**'
              - '!crates/**/docs/**'
              - '!crates/**/*.md'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'hawk.toml'
              - 'justfile'
              - 'compose.yaml'
              - 'scripts/ci/Dockerfile'
              - 'scripts/ci/**'
              - '.github/scripts/**'
              - '.pre-commit-config.yaml'
              - 'mise.toml'
            shared:
              - 'crates/peryx-archive/**'
              - 'crates/peryx-core/**'
              - 'crates/peryx-storage/**'
              - 'crates/peryx-http/**'
              - 'crates/peryx-driver/**'
              - 'crates/peryx-identity/**'
              - 'crates/peryx-policy/**'
              - 'crates/peryx-pql/**'
              - 'crates/peryx-index/**'
              - 'crates/peryx-events/**'
              - 'crates/peryx-upstream/**'
              - 'crates/peryx-search/**'
              - 'crates/peryx-ha/**'
              - 'crates/peryx-ha-distributed/**'
              - 'crates/peryx-plugin-registry/**'
              - 'crates/peryx-test-support/**'
              - 'crates/peryx-bench-core/**'
              - 'crates/peryx/**'
              - 'crates/peryx-bench/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'rust-toolchain*'
              - 'hawk.toml'
              - 'justfile'
              - 'compose.yaml'
              - 'scripts/ci/Dockerfile'
              - 'scripts/ci/**'
              - '.github/scripts/**'
              - '.github/workflows/ci.yml'
              - '.pre-commit-config.yaml'
              - 'mise.toml'
            pypi:
              - 'crates/peryx-ecosystem-pypi/**'
            oci:
              - 'crates/peryx-ecosystem-oci/**'
            frontend_tests:
              - 'crates/peryx-web/tests/frontend/**'
            docs:
              - 'README.md'
              - 'CONTRIBUTING.md'
              - 'crates/**/*.rs'
              - 'crates/*/docs/**'
              - 'site/**'
              - '.pre-commit-config.yaml'
              - '.github/workflows/ci.yml'
            automation:
              - '.github/**'
              - '.pre-commit-config.yaml'
              - 'compose.yaml'
              - 'deny.toml'
              - 'dist-workspace.toml'
              - 'justfile'
              - 'mise.toml'
              - 'renovate.json'
              - 'scripts/ci/Dockerfile'
              - 'scripts/ci/**'
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: just,ripgrep
      - id: crates
        env:
          EVENT_NAME: ${{ github.event_name }}
          PERYX_CHANGED_PATHS: ${{ steps.filter.outputs.contract_inputs_files }}
        run: |
          mkdir -p .tox
          just affected-contract-packages "$EVENT_NAME" > .tox/affected-contract-packages
          if [[ -s .tox/affected-contract-packages ]]; then selected=true; else selected=false; fi
          {
            echo "packages=$(jq -Rsc 'split("\n") | map(select(length > 0))' .tox/affected-contract-packages)"
            echo "available=$(scripts/ci/workspace-package-list contracts | jq -Rsc 'split("\n") | map(select(length > 0))')"
            echo "selected=$selected"
          } >> "$GITHUB_OUTPUT"

  lint-source:
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' || github.event_name == 'push' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create Git Bash temp directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitRoot = Split-Path -Parent (Split-Path -Parent (Get-Command git).Source)
          New-Item -ItemType Directory -Force (Join-Path $gitRoot tmp) | Out-Null
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/Swatinem/rust-cache/issues/331
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: just,ripgrep
      - name: Install Hawk
        run: |
          curl -fsSL -o /tmp/cargo-hawk.tar.gz \
            https://github.com/astral-sh/hawk/releases/download/0.1.13/cargo-hawk-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/cargo-hawk.tar.gz -C /tmp
          chmod +x /tmp/cargo-hawk-x86_64-unknown-linux-gnu/cargo-hawk /tmp/cargo-hawk-x86_64-unknown-linux-gnu/cargo-hawk-driver
          echo "/tmp/cargo-hawk-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - run: just lint-source

  lint-docs:
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' || needs.changes.outputs.docs == 'true' ||
      github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/Swatinem/rust-cache/issues/331
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: just,ripgrep
      - run: uv tool install prek
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just lint-docs

  lint-automation:
    needs: changes
    if: >-
      needs.changes.outputs.automation == 'true' || github.event_name == 'push' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: just,ripgrep
      - run: uv tool install prek
      - run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just lint-automation

  lint-deps:
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' || needs.changes.outputs.automation == 'true' ||
      github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-deny,cargo-shear,just
      - run: just lint-deps

  lint-contracts:
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' || needs.changes.outputs.automation == 'true' ||
      github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/Swatinem/rust-cache/issues/331
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-hack,cargo-insta,cargo-nextest,cargo-semver-checks,just,ripgrep
      - name: Install cargo-dist
        run: curl --proto '=https' --tlsv1.2 --silent --show-error --fail --location https://github.com/axodotdev/cargo-dist/releases/latest/download/cargo-dist-installer.sh | sh
      - run: |
          if [[ -n "$EVENT_BASE_REV" && ! "$EVENT_BASE_REV" =~ ^0+$ ]]; then
            git fetch --no-tags --depth=1 "https://github.com/${EVENT_REPOSITORY}.git" "$EVENT_BASE_REV"
            echo "BASE_REV=$EVENT_BASE_REV" >> "$GITHUB_ENV"
          else
            git fetch --no-tags --depth=1 "https://github.com/${BASE_REPOSITORY}.git" main:refs/remotes/baseline/main
            echo "BASE_REV=refs/remotes/baseline/main" >> "$GITHUB_ENV"
          fi
        env:
          BASE_REPOSITORY: ${{ github.event.repository.parent.full_name || github.repository }}
          EVENT_BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_REPOSITORY: ${{ github.repository }}
      - run: just lint-contracts "$BASE_REV"

  platform-test:
    name: platform contract (${{ matrix.os }})
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' || github.event_name == 'push' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    # Homebrew rejects the runner's preinstalled aws/tap as untrusted.
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          # v0.17 exceeds Windows' response-file limit: https://github.com/mozilla/sccache/issues/2397
          version: "v0.16.0"
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-nextest,just
      - name: Verify sccache response files
        if: runner.os == 'Windows'
        shell: pwsh
        run: just sccache-smoke
      - run: just platform-contract

  crate-contract-peryx:
    name: crate contract (peryx)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.contract_packages), 'peryx')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/crate-contract
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        with:
          package: peryx

  crate-contract-peryx-archive:
    name: crate contract (peryx-archive)
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.contract_packages), 'peryx-archive')
