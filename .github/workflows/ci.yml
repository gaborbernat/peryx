name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      nightly:
        description: Run nightly checks
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: just cargo:cargo-deny
      - run: just lint-source
      - run: just lint-deps

  automation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: just node prek
      - run: just lint-automation

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: >-
            just uv cargo:cargo-dist cargo:cargo-insta cargo:cargo-nextest
            cargo:cargo-semver-checks
      - run: just lint-contracts "$BASE_REV"
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}

  platform:
    name: platform (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: just cargo:cargo-nextest
      - run: just platform-test

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: >-
            just uv cargo:cargo-llvm-cov cargo:cargo-nextest
            github:Shopify/toxiproxy
      - run: just coverage-native
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-native
          path: .tox/coverage/native.lcov
          if-no-files-found: error

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          components: llvm-tools-preview
          targets: wasm32-unknown-unknown
          tools: >-
            just jq node cargo:cargo-llvm-cov cargo:cargo-nextest
            github:leptos-rs/cargo-leptos
      - run: just frontend-deps
      - run: just frontend-browser-deps --with-deps
      - name: Install matching LLVM
        run: |
          llvm_major="$(rustc -vV | awk '/^LLVM version:/ { split($3, version, "."); print version[1] }')"
          curl --fail --location --output llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo apt-get update
          sudo apt-get install --yes lcov
          sudo ./llvm.sh "$llvm_major"
          echo "CLANG=clang-$llvm_major" >> "$GITHUB_ENV"
      - run: just coverage-frontend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-frontend
          path: .tox/coverage/frontend-*.lcov
          if-no-files-found: error

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: just node prek zola
      - run: just lint-docs
      - run: just docs

  nightly:
    if: github.event_name == 'workflow_dispatch' && inputs.nightly
    uses: ./.github/workflows/nightly.yml

  ci-gate:
    if: always()
    needs: [automation, contracts, coverage, docs, frontend, platform, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: >-
          needs.automation.result != 'success' || needs.contracts.result != 'success' ||
          needs.coverage.result != 'success' || needs.docs.result != 'success' ||
          needs.frontend.result != 'success' || needs.platform.result != 'success' ||
          needs.source.result != 'success'
        run: exit 1
