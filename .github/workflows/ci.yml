        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
        with:
          package: peryx-web

  crate-contracts:
    name: crate contracts
    needs:
      - changes
      - crate-contract-peryx
      - crate-contract-peryx-archive
      - crate-contract-peryx-bench
      - crate-contract-peryx-bench-core
      - crate-contract-peryx-core
      - crate-contract-peryx-driver
      - crate-contract-peryx-ecosystem-oci
      - crate-contract-peryx-ecosystem-pypi
      - crate-contract-peryx-events
      - crate-contract-peryx-ha
      - crate-contract-peryx-ha-distributed
      - crate-contract-peryx-http
      - crate-contract-peryx-identity
      - crate-contract-peryx-index
      - crate-contract-peryx-plugin-registry
      - crate-contract-peryx-policy
      - crate-contract-peryx-pql
      - crate-contract-peryx-search
      - crate-contract-peryx-storage
      - crate-contract-peryx-test-support
      - crate-contract-peryx-upstream
      - crate-contract-peryx-web
    if: >-
      always() && needs.changes.result == 'success' &&
      needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: just
      - env:
          CI_RESULTS: ${{ toJSON(needs) }}
          CI_CONTEXT: >-
            {"available":${{ needs.changes.outputs.contract_packages_all }},
            "selected":${{ needs.changes.outputs.contract_packages }}}
        run: just ci-gate contracts

  system:
    name: system coverage (${{ matrix.lane }})
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' || github.event_name == 'push' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: clients
            recipe: coverage-system-clients
            report: .tox/coverage/system-clients.lcov
            client_tools: true
            proxy: false
          - lane: distributed
            recipe: coverage-system-distributed
            report: .tox/coverage/system-distributed.lcov
            client_tools: false
            proxy: true
          - lane: storage
            recipe: coverage-system-storage
            report: .tox/coverage/system-storage.lcov
            client_tools: false
            proxy: false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/Swatinem/rust-cache/issues/331
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.client_tools
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        if: matrix.client_tools
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-llvm-cov,cargo-nextest,just
      - if: matrix.proxy
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/toxiproxy-server" \
            https://github.com/Shopify/toxiproxy/releases/download/v2.12.0/toxiproxy-server-linux-amd64
          chmod +x "${RUNNER_TEMP}/toxiproxy-server"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      - run: just ${{ matrix.recipe }} "${{ matrix.report }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-system-${{ matrix.lane }}
          path: ${{ matrix.report }}
          if-no-files-found: error

  frontend:
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' || needs.changes.outputs.frontend_tests == 'true' ||
      github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/Swatinem/rust-cache/issues/331
        with:
          cache-directories: .tox/coverage-target/frontend
          cache-shared-key: frontend
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
          target: wasm32-unknown-unknown
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            crates/peryx-web/tests/frontend/package-lock.json
            crates/peryx-ecosystem-pypi/tests/frontend/package-lock.json
            crates/peryx-ecosystem-oci/tests/frontend/package-lock.json
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-leptos,cargo-llvm-cov,cargo-nextest,just
      - run: just frontend-deps
      - run: just frontend-browser-deps --with-deps
      - name: Install matching LLVM
        run: |
          llvm_major="$(rustc -vV | awk '/^LLVM version:/ { split($3, version, "."); print version[1] }')"
          curl --fail --location --output llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo apt-get update
          sudo apt-get install --yes lcov
          sudo ./llvm.sh "$llvm_major"
          echo "CLANG=clang-$llvm_major" >> "$GITHUB_ENV"
      - name: Run instrumented frontend tests
        run: just coverage-frontend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-frontend
          path: .tox/coverage/frontend-*.lcov
          if-no-files-found: error

  coverage:
    needs: [changes, crate-contracts, frontend, fuzz-oci, fuzz-pypi, system]
    if: >-
      always() &&
      (needs.changes.outputs.contracts == 'true' || github.event_name == 'push' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (needs.crate-contracts.result == 'success' ||
      (needs.changes.outputs.contracts != 'true' && needs.crate-contracts.result == 'skipped')) &&
      needs.frontend.result == 'success' &&
      needs.system.result == 'success' &&
      (needs.fuzz-oci.result == 'success' || needs.fuzz-oci.result == 'skipped') &&
      (needs.fuzz-pypi.result == 'success' || needs.fuzz-pypi.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download coverage parts
        run: gh run download "$GITHUB_RUN_ID" --pattern 'coverage-*' --dir .tox/coverage-parts
        env:
          GH_TOKEN: ${{ github.token }}
      - run: sudo apt-get update && sudo apt-get install --yes lcov
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: just
      - name: Restore selected crate packages
        env:
          CONTRACT_PACKAGES: ${{ needs.changes.outputs.contract_packages }}
        run: jq -r '.[]' <<< "$CONTRACT_PACKAGES" > .tox/affected-contract-packages
      - name: Merge executed coverage
        run: |
          mapfile -t parts < <(find .tox/coverage-parts -type f -name '*.lcov' -print | sort)
          just coverage-merge-selected .tox/coverage/lcov.info \
            .tox/affected-contract-packages "${parts[@]}"
      - name: Preserve measured crate timings
        run: |
          mkdir -p .tox/ci-timings
          mapfile -t timings < <(find .tox/coverage-parts -type f -name 'timings-*.jsonl' -print | sort)
          cat "${timings[@]}" > .tox/ci-timings/timings.jsonl
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tox/ci-timings/timings.jsonl
          key: crate-timings-${{ github.sha }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-lcov
          path: |
            .tox/coverage/lcov.info
            .tox/coverage/lcov.contracts/*.contract.json
          if-no-files-found: error
  docs:
    needs: changes
    if: >-
      needs.changes.outputs.docs == 'true' || github.event_name == 'push' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: just,zola
      - run: just docs

  scheduled-nightly:
    name: nightly analysis (${{ matrix.recipe }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        recipe: [direct-minimum, miri, sanitizer-address, sanitizer-thread]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: nightly
          components: miri,rust-src
          cache: false
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-nextest,just
      - run: just ${{ matrix.recipe }}

  scheduled-mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-mutants,cargo-nextest,just
      - run: |
          curl -fsSL -o "${RUNNER_TEMP}/toxiproxy-server" \
            https://github.com/Shopify/toxiproxy/releases/download/v2.12.0/toxiproxy-server-linux-amd64
          chmod +x "${RUNNER_TEMP}/toxiproxy-server"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      - run: just mutation-full 2 "${{ matrix.shard }}/8"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: mutation-report-${{ matrix.shard }}
          path: .tox/mutants
          if-no-files-found: ignore

  mutation-diff:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/Swatinem/rust-cache/issues/331
        with:
          cache-shared-key: mutation-diff
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-mutants,cargo-nextest,just
      - run: |
          curl -fsSL -o "${RUNNER_TEMP}/toxiproxy-server" \
            https://github.com/Shopify/toxiproxy/releases/download/v2.12.0/toxiproxy-server-linux-amd64
          chmod +x "${RUNNER_TEMP}/toxiproxy-server"
          echo "${RUNNER_TEMP}" >> "$GITHUB_PATH"
      - run: just mutation "$BASE_REV" 1 true "${{ matrix.shard }}/8"
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha }}
          CARGO_BUILD_JOBS: 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: mutation-diff-report-${{ matrix.shard }}
          path: .tox/mutants
          if-no-files-found: ignore

  fuzz-pypi:
    needs: changes
    if: >-
      needs.changes.outputs.pypi == 'true' || needs.changes.outputs.shared == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/Swatinem/rust-cache/issues/331
        with:
          toolchain: nightly
          components: llvm-tools-preview
          cache-directories: .tox/fuzz-target/peryx-ecosystem-pypi
          cache-shared-key: fuzz-pypi
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-fuzz,cargo-llvm-cov,cargo-nextest,just
      - run: just fuzz-package peryx-ecosystem-pypi 30 .tox/coverage/fuzz-pypi.lcov
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-fuzz-pypi
          path: .tox/coverage/fuzz-pypi.lcov
          if-no-files-found: error

  fuzz-oci:
    needs: changes
    if: >-
      needs.changes.outputs.oci == 'true' || needs.changes.outputs.shared == 'true' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/Swatinem/rust-cache/issues/331
        with:
          toolchain: nightly
          components: llvm-tools-preview
          cache-directories: .tox/fuzz-target/peryx-ecosystem-oci
          cache-shared-key: fuzz-oci
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-fuzz,cargo-llvm-cov,cargo-nextest,just
      - run: just fuzz-package peryx-ecosystem-oci 30 .tox/coverage/fuzz-oci.lcov
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-fuzz-oci
          path: .tox/coverage/fuzz-oci.lcov
          if-no-files-found: error

  ci-gate:
    if: always()
    needs:
      - changes
      - coverage
      - crate-contracts
      - docs
      - frontend
      - fuzz-oci
      - fuzz-pypi
      - lint-automation
      - lint-contracts
      - lint-deps
      - lint-docs
      - lint-source
      - mutation-diff
      - platform-test
      - scheduled-mutation
      - scheduled-nightly
      - system
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: just
      - name: Verify required jobs
        env:
          CI_CONTEXT: >-
            {"event":"${{ github.event_name }}","automation":${{ needs.changes.outputs.automation == 'true' }},
            "contracts":${{ needs.changes.outputs.contracts == 'true' }},
            "docs":${{ needs.changes.outputs.docs == 'true' }},
            "frontend_tests":${{ needs.changes.outputs.frontend_tests == 'true' }},
            "oci":${{ needs.changes.outputs.oci == 'true' }},"pypi":${{ needs.changes.outputs.pypi == 'true' }},
            "rust":${{ needs.changes.outputs.rust == 'true' }},
            "shared":${{ needs.changes.outputs.shared == 'true' }}}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: just ci-gate main
