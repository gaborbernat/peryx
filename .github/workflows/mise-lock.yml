name: Update mise lock

on:
  schedule:
    - cron: "0 14 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mise-lock
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: --locked just
      - run: just mise-lock
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          add-paths: mise.lock
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          body: |-
            `mise lock --bump` refreshed the versions selected by `latest` and their checksums.
            Exact versions in `mise.toml` remain pinned.
          branch: automation/mise-lock
          commit-message: "🔧 chore: bump mise lock"
          delete-branch: true
          labels: area:ci
          sign-commits: true
          title: "🔧 chore: bump mise lock"
