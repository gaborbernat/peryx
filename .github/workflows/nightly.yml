name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  analysis:
    name: ${{ matrix.recipe }}
    strategy:
      fail-fast: false
      matrix:
        recipe: [features, direct-minimum, miri, loom]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          toolchain: nightly
          components: miri,rust-src
          tools: just cargo:cargo-hack
      - run: just ${{ matrix.recipe }}

  sanitizer:
    name: ${{ matrix.recipe }}
    strategy:
      fail-fast: false
      matrix:
        recipe: [sanitizer-address, sanitizer-thread]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          toolchain: nightly
          targets: x86_64-unknown-linux-gnuasan,x86_64-unknown-linux-gnutsan
          tools: >-
            just uv cargo:cargo-nextest ubi:Shopify/toxiproxy
      - run: just ${{ matrix.recipe }}

  mutation:
    name: mutation (${{ matrix.shard }}/8)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: >-
            just uv cargo:cargo-mutants cargo:cargo-nextest
            ubi:Shopify/toxiproxy
      - run: just mutation "${{ matrix.shard }}/8" true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: mutation-${{ matrix.shard }}
          path: .tox/mutants
          if-no-files-found: error

  fuzz:
    name: fuzz (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: peryx-ecosystem-pypi
            target: pypi_filename
          - package: peryx-ecosystem-oci
            target: oci_reference
          - package: peryx-ecosystem-oci
            target: oci_manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          toolchain: nightly
          tools: just cargo:cargo-fuzz
      - run: just fuzz "${{ matrix.package }}" "${{ matrix.target }}" 60

  live-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          tools: just uv cargo:cargo-nextest
      - run: just test-deps
      - run: PATH="$PWD/.tox/tools/bin:$PATH" just e2e-live
