name: Prepare release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  assemble:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.14
          install_args: --locked github:knope-dev/knope prek uv
          cache: false
      - id: version
        run: |
          day="$(date -u +%Y).$(date -u +%-m%d)"
          last=$(git tag --list "v${day}.*" | sed "s/^v${day}\.//" | sort -n | tail -n 1)
          echo "version=${day}.$((${last:--1} + 1))" >> "$GITHUB_OUTPUT"
      - run: |
          if ! compgen -G ".changeset/*.md" > /dev/null; then
            echo "::error::no change files; add a .changeset/*.md file before preparing a release"
            exit 1
          fi
      - name: Assemble release patch
        run: |
          knope prepare-release --verbose --override-version "$VERSION"
          git diff HEAD --binary > "$RUNNER_TEMP/release.patch"
          test -s "$RUNNER_TEMP/release.patch"
        env:
          VERSION: ${{ steps.version.outputs.version }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-patch
          path: ${{ runner.temp }}/release.patch
          if-no-files-found: error
  push:
    needs: assemble
    runs-on: ubuntu-24.04
    environment: release-auth
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-patch
          path: ${{ runner.temp }}/release-patch
      - name: Validate release patch
        env:
          VERSION: ${{ needs.assemble.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          git apply --check "$RUNNER_TEMP/release-patch/release.patch"
          git apply --index "$RUNNER_TEMP/release-patch/release.patch"
          while IFS= read -r path; do
            case "$path" in
              Cargo.toml|Cargo.lock|CHANGELOG.md|.changeset/*.md|site/static/openapi.json) ;;
              crates/peryx-ecosystem-oci/fuzz/Cargo.toml|crates/peryx-ecosystem-pypi/fuzz/Cargo.toml) ;;
              crates/peryx-ecosystem-oci/tests/system-suite/Cargo.toml) ;;
              crates/peryx-ecosystem-pypi/tests/system-suite/Cargo.toml) ;;
              *) echo "::error::unexpected release path: $path"; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          grep -Fq "## $VERSION (" CHANGELOG.md
          grep -Fxq "version = \"$VERSION\"" Cargo.toml
          git diff --cached --check
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Commit and tag release
        env:
          VERSION: ${{ needs.assemble.outputs.version }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_USER_ID: ${{ vars.RELEASE_APP_USER_ID }}
        run: |
          set -euo pipefail
          git config user.name "peryx-release[bot]"
          git config user.email "${APP_USER_ID}+peryx-release[bot]@users.noreply.github.com"
          git commit --message "🔖 chore(release): v$VERSION"
          git tag "v$VERSION"
          gh auth setup-git --hostname github.com --force
          git push --atomic origin HEAD:main "refs/tags/v$VERSION"
