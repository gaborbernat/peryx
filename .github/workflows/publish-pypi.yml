# Manual runs build release artifacts without publishing them.
name: publish-pypi
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheels:
    name: wheel ${{ matrix.platform.os }}-${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: linux, runner: ubuntu-24.04, target: x86_64, manylinux: "2_28" }
          - { os: linux, runner: ubuntu-24.04-arm, target: aarch64, manylinux: "2_28" }
          - { os: linux, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { os: linux, runner: ubuntu-24.04, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2, zig: true }
          - { os: macos, runner: macos-26, target: aarch64, host: true, rust_target: aarch64-apple-darwin }
          - { os: macos, runner: macos-26, target: x86_64 }
          - { os: windows, runner: windows-2025, target: x64, host: true, rust_target: x86_64-pc-windows-msvc }
          - { os: windows, runner: windows-11-arm, target: aarch64, host: true, rust_target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin sccache on Windows
        if: matrix.platform.os == 'windows'
        shell: pwsh
        run: |
          python3 -m pip install sccache==0.16.0
          if ((sccache --version) -ne "sccache 0.16.0") {
            throw "unexpected sccache version"
          }
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        if: matrix.platform.host == true
        with:
          tool: just,maturin
      - name: Build host wheel
        if: matrix.platform.host == true
        env:
          RUSTC_WRAPPER: sccache
          RUST_TARGET: ${{ matrix.platform.rust_target }}
        run: just package-wheel --target "$RUST_TARGET"
      - name: Build wheel
        if: matrix.platform.host != true
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --locked --out dist ${{ matrix.platform.zig && '--zig' || '' }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          sccache: true
      - name: Verify sccache version
        if: matrix.platform.os == 'windows'
        shell: pwsh
        run: |
          if ((sccache --version) -ne "sccache 0.16.0") {
            throw "maturin-action replaced the pinned sccache"
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-${{ matrix.platform.os }}-${{ matrix.platform.target }}
          path: dist
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: just,maturin
      - name: Build sdist
        run: just package-sdist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist
          if-no-files-found: error

  publish:
    name: publish to PyPI
    if: ${{ github.event_name != 'workflow_dispatch' }}
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      attestations: write # Sign the Python packages.
      contents: read # Read release metadata.
      id-token: write # Authenticate to PyPI without a stored token.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        env:
          NODE_OPTIONS: --no-deprecation # https://github.com/actions/download-artifact/issues/484
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Attest Python packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist
