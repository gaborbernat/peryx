[host]
model = "Mac16,10"
cpu = "Apple M4"
architecture = "arm64"
cores = "10 (4 performance + 6 efficiency)"
memory = "16 GB"
os = "macOS 27.0"
kernel = "27.0.0"

[[volumes]]
role = "benchmark scratch: every server's store and cache; the checkout the peryx binary is built and run from"
mount = "/Volumes/OWC"
file_system = "apfs"
kind = "SSD"
size = "2.0 TB"
removable = true
benchmarked = true

[[baselines]]
name = "memory copy"
measures = "moving bytes between two buffers larger than L2"
single = "41.8 GB/s ±3%"
parallel = "43.5 GB/s ±2%"

[[baselines]]
name = "disk write"
measures = "a sequential write to /Volumes/OWC (SSD), flushed to the device"
single = "3.1 GB/s ±4%"
parallel = "2.8 GB/s ±6%"

[[baselines]]
name = "file read, warm"
measures = "reading a file on /Volumes/OWC (SSD) that the page cache already holds, as a warm registry does"
single = "15.1 GB/s ±1%"
parallel = "28.0 GB/s ±2%"

[[baselines]]
name = "minimal HTTP server"
measures = "a 30 MB body over 127.0.0.1 from a server that only writes a buffer"
single = "6.2 GB/s ±29%"
parallel = "8.7 GB/s ±19%"
